#!/bin/bash
# CI workflow for Rosette — GitHub Actions
#
# Runs on the latest macOS runner, builds for iOS Simulator and macOS,
# runs tests, and runs lint.

name: Rosette

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: games/07-rosette
    steps:
      - uses: actions/checkout@11bd71901bbe5b163cceee1484ab1772e3a73683 # v4.2.2

      - name: Install dependencies
        run: |
          brew install xcodegen swiftlint swift-format

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS
        run: |
          xcodebuild build -scheme Rosette-iOS \
            -destination "platform=iOS Simulator,name=iPad Pro 13-inch (M5)" \
            -configuration Debug \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Build macOS
        run: |
          xcodebuild build -scheme Rosette-macOS \
            -destination "platform=macOS" \
            -configuration Debug \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Run tests
        run: |
          swift test --parallel --enable-code-coverage

      - name: Run lint
        run: |
          swiftlint lint --strict 2>&1 | tee lint-swiftlint.log || true
          swift-format --lint --recursive Packages/ App/ Tools/ Tests/ 2>&1 || true
          bash Tools/check-imports.sh 2>&1 || true
          bash Tools/content-lint/run.sh 2>&1 || true
