disabled_rules:
  - trailing_whitespace
  - todo
  - line_length
  - type_body_length
  - function_body_length
  - opening_brace
  - cyclomatic_complexity
  - file_length
  - identifier_name
  - large_tuple
  - closure_parameter_position
  - nesting
  - function_parameter_count
  - for_where
  - trailing_comma
  # SwiftUI's canonical multi-trailing-closure idiom (Button { } label: { }).
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - unused_import

# App/ is linted; the determinism ban (banned_api) applies to the Core
# packages and is enforced by Tools/check-imports.sh. The App layer may
# use the wall clock (the fps meter's window) with scoped disable
# comments at each such site.
excluded:
  - .build
  - Packages/**/.build
  - DerivedData
  - fastlane
  - "*.xcodeproj"

line_length:
  warning: 120
  error: 200
