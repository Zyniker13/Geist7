disabled_rules:
  - trailing_whitespace
  - todo
  - line_length
  - type_body_length
  - function_body_length
  - opening_brace
  - cyclomatic_complexity
  - file_length
  - identifier_name
  - large_tuple
  - closure_parameter_position
  - nesting
  - function_parameter_count
  - for_where
  - trailing_comma
  # SwiftUI's canonical multi-trailing-closure idiom (Button { } label: { }).
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - empty_count
  - force_unwrapping
  - implicitly_unwrapped_optional
  - modifier_order
  - unused_import

# App/ is linted (P8 polish): the determinism ban (banned_api) applies to the
# Core/Content/AI packages; the App layer may use the wall clock and view
# identity UUIDs, with scoped disable comments at each such site.
excluded:
  - .build
  - Packages/.build
  - Packages/*/.build
  - Tools/

custom_rules:
  banned_api:
    name: "Banned APIs in Core/Content/AI"
    regex: "(SystemRandomNumberGenerator|Int\\.random\\(|Date\\(\\)|UUID\\(\\))"
    message: "Banned in Core, Content, and AI: use SeededRNG, Fixed, or deterministic alternatives"
    severity: error
